<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<title>Firebase ① プロジェクトを作る</title>
<link rel="stylesheet" href="mock.css"></head>
<body>
<div class="shot">
  <div class="top fb">
    <div class="logo"></div>
    <span class="name">Firebase</span>
    <div class="right"><div class="ava"></div></div>
  </div>

  <div class="body">
    <div style="font-size:21px; font-weight:400; margin-bottom:4px">プロジェクトの作成</div>
    <p class="lead">ステップ 1 / 3</p>

    <div class="field">
      <label>プロジェクト名</label>
      <div class="input on wide mark">my-site<span class="n">1</span></div>
      <div class="sub">プロジェクト ID: <b>my-site-3f7a2</b>　← 自動で付く。あとで変えられない</div>
    </div>

    <div class="fbcard" style="margin-top:16px">
      <h3>Google アナリティクス</h3>
      <p>アクセス数を調べる機能。<b>今は要らないので off でいい</b>。あとから足せる。</p>
      <div style="margin-top:9px; display:flex; align-items:center; gap:9px">
        <span style="width:34px; height:18px; border-radius:999px; background:#dadce0; position:relative; display:inline-block">
          <span style="position:absolute; left:2px; top:2px; width:14px; height:14px; border-radius:50%; background:#fff"></span>
        </span>
        <span style="font-size:12.5px; color:#5f6368">オフ</span>
      </div>
    </div>

    <div style="text-align:right; margin-top:16px">
      <span class="btn blue mark">続行<span class="n">2</span></span>
    </div>
  </div>
</div>
</body></html>
