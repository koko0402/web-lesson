<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<title>GitHub ② ファイルを置く</title>
<link rel="stylesheet" href="mock.css"></head>
<body>
<div class="shot">
  <div class="top">
    <div class="logo"></div>
    <div class="search">Type / to search</div>
    <div class="right"><span>＋ ▾</span><div class="ava"></div></div>
  </div>

  <div class="body">
    <div style="font-size:19px; margin-bottom:14px">
      <span style="color:#0969da">yuu</span>
      <span style="color:#59636e"> / </span>
      <b>my-site</b>
      <span style="border:1px solid #d0d7de; border-radius:999px; font-size:11px; padding:1px 8px; margin-left:7px; color:#59636e">Public</span>
    </div>

    <div style="font-size:13px; color:#59636e; margin-bottom:10px">
      Add files → <b style="color:#1f2328">Upload files</b>
    </div>

    <div class="drop hover mark left"><span class="n">1</span>
      <div class="big">Drag files here to add them to your repository</div>
      <div style="font-size:12.5px; color:#59636e">
        または <span class="link">choose your files</span>
      </div>

      <div class="files">
        <div class="file"><i></i>index.html</div>
        <div class="file"><i></i>style.css</div>
        <div class="file"><i></i>script.js</div>
        <div class="file folder"><i></i>img</div>
      </div>
    </div>

    <div style="margin-top:16px; border:1px solid #d0d7de; border-radius:8px; padding:13px 15px">
      <div class="h2">Commit changes</div>
      <div class="input wide" style="margin-bottom:8px">Add files via upload</div>
      <div style="text-align:left">
        <span class="btn green mark">Commit changes<span class="n">2</span></span>
      </div>
    </div>
  </div>


</div>
</body></html>
