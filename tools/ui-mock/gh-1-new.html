<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<title>GitHub ① 新しい置き場を作る</title>
<link rel="stylesheet" href="mock.css"></head>
<body>
<div class="shot">
  <div class="top">
    <div class="logo"></div>
    <div class="search">Type / to search</div>
    <div class="right"><span>＋ ▾</span><div class="ava"></div></div>
  </div>

  <div class="body">
    <div class="h1">Create a new repository</div>

    <div class="field">
      <label>Repository template</label>
      <div class="input" style="width:230px">No template ▾</div>
    </div>

    <div class="field">
      <div class="pair">
        <div>
          <label>Owner *</label>
          <div class="input" style="width:150px">● yuu ▾</div>
        </div>
        <span class="slash">/</span>
        <div style="flex:1">
          <label>Repository name *</label>
          <div class="input on wide mark">my-site<span class="n">1</span></div>
        </div>
      </div>
      <div class="sub">Great repository names are short and memorable.</div>
    </div>

    <div class="field">
      <label>Description <span style="font-weight:400;color:#59636e">(optional)</span></label>
      <div class="input wide"><span class="ph">はじめて作ったサイト</span></div>
    </div>

    <div style="border-top:1px solid #d8dee4; padding-top:12px">
      <div class="radio on mark left" style="padding-left:6px">
        <i></i><span class="n">2</span>
        <div><b>Public</b><span class="d">だれでも見られる。GitHub Pages で公開するならこっち</span></div>
      </div>
      <div class="radio">
        <i></span>
        <div><b>Private</b><span class="d">自分だけ。無料では Pages が使えないので、今回は選ばない</span></div>
      </div>
    </div>

    <div style="border-top:1px solid #d8dee4; margin-top:14px; padding-top:14px; text-align:right">
      <span class="btn green mark">Create repository<span class="n">3</span></span>
    </div>
  </div>



</div>
</body></html>
