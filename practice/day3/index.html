<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>ユウのトリセツ</title>
    <!-- ここで CSS ファイルを読み込む。これ1行が今日の主役 -->
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <header>
      <h1>ユウのトリセツ</h1>
      <p class="sub">取り扱いには十分ご注意ください</p>
    </header>

    <main>

      <section class="box">
        <h2>基本仕様</h2>
        <ul>
          <li>起動時刻：<span class="hilight">11:00 ごろ</span></li>
          <li>燃料：からあげ、炭酸、睡眠</li>
          <li>連続稼働：最長 4 時間</li>
        </ul>
      </section>

      <section class="box">
        <h2>取扱注意</h2>
        <p>お腹がすくと <strong>無言</strong> になります。<br>
        そういうときは何か食べさせてください。</p>
        <p class="caution">※ 朝いちで長い話をするのは非推奨です</p>
      </section>

      <section class="box card-photo">
        <h2>本体</h2>
        <img src="img/photo.webp" alt="ユウ" class="photo">
        <p>だいたいこんな顔をしています。</p>
      </section>

    </main>

    <footer>
      <p>&copy; 2026 ユウ ／ DAY 3（CSS 1回目）</p>
    </footer>

  </body>
</html>
