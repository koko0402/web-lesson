<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レイアウト練習 ── 位置・サイズ・フォント</title>
<link rel="stylesheet" href="playground.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<style>
  .q{
    background:rgba(255,255,255,.76); border:1.5px solid rgba(44,58,66,.2);
    border-left:5px solid var(--blue); border-radius:8px;
    padding:16px 20px 18px; margin:16px 0;
  }
  .q.done{ border-left-color:var(--green); }
  .q-head{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .q-no{ font-family:var(--f-code); font-size:13px; color:#fff; background:var(--blue);
         border-radius:999px; padding:1px 11px; flex:none; }
  .q.done .q-no{ background:var(--green); }
  .q-title{ font-size:19px; font-weight:600; }
  .q-desc{ font-size:15px; color:var(--ink-2); margin:5px 0 12px; }

  .q-view{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:12px; }
  @media (max-width:820px){ .q-view{ grid-template-columns:1fr; } }
  .view{ border:1.5px solid rgba(44,58,66,.2); border-radius:6px; overflow:hidden; background:#fff; }
  .view-cap{ font-size:12.5px; padding:4px 10px; background:rgba(44,58,66,.07);
             border-bottom:1.5px solid rgba(44,58,66,.12); }
  .view.goal .view-cap{ background:#ffe873; }
  .view.mine .view-cap{ background:#cfe6f7; }
  .view-body{ padding:14px; min-height:132px; display:grid; place-items:center; }

  .q-ctrl{ display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }
  .q-ctrl label{ font-family:var(--f-code); font-size:13px; display:flex; align-items:center; gap:6px; }
  .q-ctrl select{ font-size:13px; padding:4px 9px; }

  .q-foot{ display:flex; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap; }
  .judge{ font-size:15px; font-weight:600; }
  .judge.ok{ color:var(--green); }
  .judge.ng{ color:var(--red); }
  .q-why{ display:none; font-size:14px; line-height:1.8; background:#fff2a8;
          padding:10px 14px; border-radius:5px; margin-top:11px; }
  .q.shown .q-why{ display:block; }

  /* 問題のなかで使う部品 */
  .card-s{ background:#fdf8ec; border:1.5px solid rgba(44,58,66,.25); border-radius:4px; }
  .chip{ background:#cfe6f7; border:1.5px solid #6ba3cf; border-radius:4px;
         padding:6px 12px; font-size:13px; color:#1d4f77; }
  .plate{ width:100%; height:104px; background:repeating-linear-gradient(45deg,#f6f2e4 0 8px,#f1ecdb 8px 16px);
          border:1.5px dashed rgba(44,58,66,.26); border-radius:5px; }

  .score{ font-size:16px; }
  .score b{ font-size:22px; color:var(--red); }
  .gnav{ display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 2px; }
  .gnav a{ font-size:14px; text-decoration:none; color:var(--ink); background:#fff;
           border:1.5px solid rgba(44,58,66,.25); border-radius:999px; padding:4px 14px; }
  .gnav a:hover{ border-color:var(--red); color:var(--red); }
</style>
</head>
<body>
<div class="sheet">

  <div class="crumb"><a href="../index.html">もくじ</a> ／ さわって試す</div>
  <h1>レイアウト練習</h1>
  <p class="lead">左の<b>お題</b>とおなじ見た目になるように、値を選んで。<br>
    位置・サイズ・フォントの3種類、全9問。<b>答えを見る前に、まず選んでみること。</b></p>

  <div class="fusen" data-c="blue">
    <b>覚え方より、当てにいく</b>
    プロパティ名を暗記する必要はない。<span class="mk">「この見た目にしたい」→「どれを動かす？」</span>
    の順で考える練習。外したら、なぜ外したかを読んで次にいって。
  </div>

  <p class="score">正解 <b id="score">0</b> / 9 問</p>

  <div class="gnav">
    <a href="#gA">フォント編</a>
    <a href="#gB">サイズ編</a>
    <a href="#gC">位置編</a>
    <a href="css-gallery.html">CSS見本帳を開く</a>
  </div>

  <h2 id="gA">フォント編</h2>
  <div id="A"></div>

  <h2 id="gB">サイズ編</h2>
  <div id="B"></div>

  <h2 id="gC">位置編</h2>
  <div id="C"></div>

  <div class="fusen" data-c="green" style="margin-top:30px">
    <b>全問できたら</b>
    <a href="../final/oshi/index.html">推しの紹介サイト</a> の課題に進んで。
    ここで使った9つの形が、そのまま部品として出てくる。
  </div>

  <a class="back" href="../index.html">← もくじに戻る</a>
</div>

<script>
/* =========================================================
   問題データ
     html  : 見本のマークアップ。data-t を付けた要素にCSSが当たる
     wrap  : 外側の枠に当てるCSS（position:relative など）
     props : n=プロパティ o=選択肢 a=正解
   ========================================================= */
const QUIZ = [
  /* ---------------- フォント編 ---------------- */
  { g:'A', title:'本文を読みやすくする',
    desc:'長い文章。本文の標準サイズにして、行間をゆったりさせて。',
    html:'<p data-t style="margin:0">Webサイトは、文字が読めるかどうかで価値がほとんど決まる。'
        +'まず本文を読みやすくしてから、飾りにとりかかって。</p>',
    props:[
      { n:'font-size',   o:['12px','16px','20px','28px'],   a:'16px' },
      { n:'line-height', o:['1.0','1.2','1.8','2.6'],       a:'1.8'  }
    ],
    why:'本文は <b>16px</b> が標準。小さいほど「情報量が多そう」に見えるが、読まれなくなる。'
       +'日本語は英語より字面が複雑なので、行間は <b>1.8</b> 前後がいちばん読みやすい。' },

  { g:'A', title:'見出しを目立たせる',
    desc:'見出しらしく、大きく・太くして。本文と差をつけるのが目的。',
    html:'<p data-t style="margin:0">ユウのトリセツ</p>',
    props:[
      { n:'font-size',   o:['16px','20px','28px','40px'],   a:'28px' },
      { n:'font-weight', o:['300','400','600','700'],       a:'700'  }
    ],
    why:'見出しは<b>大きさ</b>と<b>太さ</b>の2つで作る。どちらか片方だけだと弱く見える。'
       +'本文が16pxなら、見出しは1.5〜2倍あたりが目安。' },

  { g:'A', title:'ロゴっぽく見せる',
    desc:'明朝体で、字間をうんと広げて、中央にそろえて。',
    html:'<p data-t style="margin:0;width:100%">MICHIRU</p>',
    props:[
      { n:'font-family',     o:['sans-serif','serif','monospace'],  a:'serif' },
      { n:'letter-spacing',  o:['0','.05em','.3em'],                a:'.3em'  },
      { n:'text-align',      o:['left','center','right'],           a:'center'}
    ],
    why:'字間（<b>letter-spacing</b>）を広げるだけで、急に「デザインされたもの」に見える。'
       +'ロゴ・扉・キャッチコピーで使う小技。ただし本文でやると読みにくくなる。' },

  /* ---------------- サイズ編 ---------------- */
  { g:'B', title:'カードに余白をつける',
    desc:'文字が枠にくっついていて窮屈。内側に余白をつけ、角を丸めて。',
    html:'<div data-t class="card-s" style="width:190px">カードの中身</div>',
    props:[
      { n:'padding',       o:['0','4px','20px','60px'],      a:'20px' },
      { n:'border-radius', o:['0','12px','50%'],             a:'12px' }
    ],
    why:'「なんか窮屈」の原因はほぼ <b>padding</b> 不足。迷ったら増やして。'
       +'角丸は 8〜16px くらいが自然。50% は正方形のときだけ円になる。' },

  { g:'B', title:'ボックスを中央に置く',
    desc:'左に寄っている箱を、横の中央に持ってきて。幅は 200px のままにする。',
    html:'<div style="width:100%"><div data-t class="chip" style="width:200px;text-align:center">中央に来てほしい</div></div>',
    props:[
      { n:'margin', o:['0','0 auto','auto 0','20px'],  a:'0 auto' }
    ],
    why:'<b>margin: 0 auto</b> は「上下は0、左右はブラウザにおまかせ」という意味。'
       +'左右の余白が等分されるので中央に来る。<b>width を決めていないと効かない</b>（余白が残らないため）。' },

  { g:'B', title:'写真を丸いアイコンに切り抜く',
    desc:'横長（4:3）の写真。つぶさずに 96px の正円アイコンにして。',
    html:'<img data-t src="../assets/wood.jpg" alt="" '
        +'style="width:96px;height:96px;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.28)">',
    props:[
      { n:'object-fit',    o:['fill','contain','cover'],  a:'cover' },
      { n:'border-radius', o:['0','12px','50%'],          a:'50%'   }
    ],
    why:'幅と高さを同じにしただけだと、横長の写真は<b>横につぶれる</b>（fill が初期値のため）。'
       +'<b>object-fit: cover</b> は「比率を保ったまま枠を埋め、はみ出したぶんは切る」。SNSのアイコンと同じ作り。'
       +'<br>contain だと全体は入るが、<b>上下にすき間</b>ができる。' },

  /* ---------------- 位置編 ---------------- */
  { g:'C', title:'横に並べて中央にそろえる',
    desc:'縦に積まれている3つを、横一列にして、枠の中央に置いて。',
    html:'<div data-t class="plate" style="padding:8px"><span class="chip">1</span><span class="chip">2</span><span class="chip">3</span></div>',
    props:[
      { n:'display',         o:['block','inline','flex'],                    a:'flex'   },
      { n:'justify-content', o:['flex-start','center','space-between'],      a:'center' },
      { n:'align-items',     o:['stretch','flex-start','center'],            a:'center' }
    ],
    why:'横に並べたいときは、<b>並べたいものの親</b>に <b>display:flex</b> を書く。'
       +'そのあと横方向は <b>justify-content</b>、縦方向は <b>align-items</b> で位置を決める。この3点セットで覚えて。' },

  { g:'C', title:'右下にバッジを置く',
    desc:'「NEW」を、カードの右下に重ねて。カード側には position:relative が付いている。',
    html:'<div class="plate" style="position:relative;padding:8px">'
        +'<span class="chip">カード本体</span>'
        +'<span data-t class="chip" style="background:#fbd6cd;border-color:#d38b7b;color:#8f3a28;right:8px;bottom:8px">NEW</span></div>',
    props:[
      { n:'position', o:['static','relative','absolute','fixed'],  a:'absolute' }
    ],
    why:'<b>absolute</b> は「いちばん近い position:relative の親」を基準に、好きな場所へ置ける。'
       +'浮くので元の場所を空けない。<b>親の relative を書き忘れるとページの左上へ飛ぶ</b> ── 事故の9割はこれ。' },

  { g:'C', title:'ヘッダーを作る',
    desc:'左にサイト名、右にメニュー。よくあるヘッダーの形にして。',
    html:'<div data-t class="plate" style="height:auto;padding:12px 14px">'
        +'<span class="chip">サイト名</span><span class="chip">メニュー</span></div>',
    props:[
      { n:'display',         o:['block','flex','grid'],                                  a:'flex'          },
      { n:'justify-content', o:['flex-start','center','space-between','space-around'],    a:'space-between' },
      { n:'align-items',     o:['stretch','flex-start','center'],                        a:'center'        }
    ],
    why:'<b>space-between</b> は「最初を左端、最後を右端、残りは等間隔」。'
       +'ヘッダー・フッター・カードの上下段など、出番がとても多い値。覚える価値がある。' }
];

/* =========================================================
   描画
   ========================================================= */
const state = QUIZ.map(function (q) {
  return q.props.map(function (p) { return p.o[0]; });
});
let solved = QUIZ.map(function () { return false; });

function css(q, vals) {
  return q.props.map(function (p, i) { return p.n + ': ' + vals[i] + ';'; }).join('\n');
}
function apply(root, q, vals) {
  const t = root.querySelector('[data-t]');
  if (!t) return;
  q.props.forEach(function (p, i) { t.style.setProperty(p.n, vals[i]); });
}

function build(qi) {
  const q = QUIZ[qi];
  const el = document.createElement('div');
  el.className = 'q';
  el.innerHTML =
    '<div class="q-head"><span class="q-no">Q' + (qi + 1) + '</span>' +
      '<span class="q-title">' + q.title + '</span></div>' +
    '<p class="q-desc">' + q.desc + '</p>' +
    '<div class="q-view">' +
      '<div class="view goal"><div class="view-cap">お題（これと同じにする）</div>' +
        '<div class="view-body" data-goal>' + q.html + '</div></div>' +
      '<div class="view mine"><div class="view-cap">あなたの答え</div>' +
        '<div class="view-body" data-mine>' + q.html + '</div></div>' +
    '</div>' +
    '<div class="q-ctrl" data-ctrl></div>' +
    '<div class="outcode" data-code></div>' +
    '<div class="q-foot">' +
      '<button class="btn" data-check>答え合わせ</button>' +
      '<button class="btn sm" data-reveal>正解を見る</button>' +
      '<span class="judge" data-judge></span>' +
    '</div>' +
    '<div class="q-why"><b>なぜそうなるか</b><br>' + q.why + '</div>';

  /* お題は正解を当てた状態で固定 */
  apply(el.querySelector('[data-goal]'), q, q.props.map(function (p) { return p.a; }));

  /* 選択肢 */
  const ctrl = el.querySelector('[data-ctrl]');
  q.props.forEach(function (p, i) {
    const lab = document.createElement('label');
    lab.innerHTML = p.n + ':';
    const sel = document.createElement('select');
    p.o.forEach(function (o) {
      const op = document.createElement('option');
      op.value = o; op.textContent = o;
      sel.appendChild(op);
    });
    sel.value = state[qi][i];
    sel.addEventListener('change', function () {
      state[qi][i] = sel.value;
      refresh(qi, el);
      el.querySelector('[data-judge]').textContent = '';
      el.querySelector('[data-judge]').className = 'judge';
    });
    lab.appendChild(sel);
    ctrl.appendChild(lab);
  });

  el.querySelector('[data-check]').addEventListener('click', function () {
    const ok = q.props.every(function (p, i) { return state[qi][i] === p.a; });
    const j = el.querySelector('[data-judge]');
    j.textContent = ok ? '正解！' : 'まだ違う。お題と見くらべてみて';
    j.className = 'judge ' + (ok ? 'ok' : 'ng');
    if (ok) {
      el.classList.add('done', 'shown');
      if (!solved[qi]) { solved[qi] = true; updateScore(); }
    }
  });

  el.querySelector('[data-reveal]').addEventListener('click', function () {
    q.props.forEach(function (p, i) { state[qi][i] = p.a; });
    ctrl.querySelectorAll('select').forEach(function (s, i) { s.value = q.props[i].a; });
    refresh(qi, el);
    el.classList.add('shown');
    const j = el.querySelector('[data-judge]');
    j.textContent = 'これが正解';
    j.className = 'judge';
  });

  refresh(qi, el);
  document.getElementById(q.g).appendChild(el);
}

function refresh(qi, el) {
  const q = QUIZ[qi];
  const mine = el.querySelector('[data-mine]');
  mine.innerHTML = q.html;
  apply(mine, q, state[qi]);
  el.querySelector('[data-code]').textContent = css(q, state[qi]);
}

function updateScore() {
  document.getElementById('score').textContent =
    solved.filter(Boolean).length;
}

QUIZ.forEach(function (_, i) { build(i); });
</script>
</body>
</html>
