<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>あると便利なCSS ── 困ったときに探す場所</title>
<link rel="stylesheet" href="playground.css">
<style>
  .filter{ display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin:14px 0 4px; }
  .filter input{ flex:1; min-width:200px; }
  .hit{ font-size:13px; color:var(--ink-2); font-family:var(--f-code); }

  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(400px,1fr)); gap:14px; margin-top:12px; }
  .card{
    background:rgba(255,255,255,.72); border:1.5px solid rgba(44,58,66,.2);
    border-radius:8px; padding:13px 15px 14px; display:flex; flex-direction:column; min-width:0;
  }
  .card h3{ margin:0 0 3px; font-size:16px; }
  .card .why{ font-size:13px; color:var(--ink-2); margin:0 0 9px; line-height:1.65; }

  /* 見本の枠 */
  .demo{
    border:1.5px dashed rgba(44,58,66,.28); border-radius:6px;
    background:#fff; padding:13px; margin-bottom:9px; overflow:hidden;
    min-height:84px; display:flex; align-items:center; justify-content:center;
  }
  .demo > *{ max-width:100%; }

  .snip{
    font-family:var(--f-code); font-size:12.5px; line-height:1.7;
    white-space:pre-wrap; overflow-wrap:anywhere;   /* 横に切れて読めなくなるより、折り返すほうがいい */
    background:var(--code-bg); color:#e6e6e0; border-radius:6px;
    padding:10px 12px; margin-top:auto;
  }
  .snip b{ color:#7fc4ff; font-weight:400; }
  .snip i{ color:#ffd479; font-style:normal; }
  .snip u{ color:#c48cff; text-decoration:none; }
  .snip s{ color:#8d9aa4; text-decoration:none; }
  .card .copy{ align-self:flex-start; margin-top:8px; }

  .tag{
    font-size:11px; padding:1px 8px; border-radius:999px; margin-left:6px;
    background:rgba(44,58,66,.1); color:var(--ink-2); vertical-align:2px;
  }

  /* ---------- 見本で使う中身 ---------- */
  .box{ background:#cfe6f7; border:1px solid #8ab6d6; padding:9px 13px; border-radius:4px; font-size:14px; }
  .box.b{ background:#fbd6cd; border-color:#dda192; }
  .box.c{ background:#d5efce; border-color:#9cc894; }
</style>
</head>
<body>
<div class="sheet">

  <div class="crumb"><a href="../index.html">もくじ</a> ／ さわって試す</div>
  <h1>あると便利なCSS</h1>
  <p class="lead">「これ、どう書くんだっけ」を毎回ぜんぶ覚えるのは無理。<br>
    <b>ここから探してコピーする</b>ためのページ。見本はその場で動いている。</p>

  <div class="fusen" data-c="green">
    <b>覚えなくていい</b>
    現場の人も、こういうのは毎回調べている。
    大事なのは<span class="mk">「こういうことができる」と知っていること</span>だけ。
    名前さえ覚えておけば、あとは探せる。
  </div>

  <div class="filter">
    <input type="text" id="find" placeholder="困っていることで探す（例：まんなか／はみ出す／スマホ）">
    <span class="hit" id="hit"></span>
  </div>
  <div class="toc" id="toc"></div>

  <div id="out"></div>

  <a class="back" href="../index.html">← もくじに戻る</a>
</div>

<script>
'use strict';

const $  = q => document.querySelector(q);
const $$ = q => [...document.querySelectorAll(q)];
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* ============================================================
   中身
   ------------------------------------------------------------
   t    … 名前
   why  … いつ使うか（困りごとの言葉で書く）
   demo … 見本のHTML
   css  … コピーさせるCSS
   ============================================================ */
const GROUPS = [

{ g:'まんなかに置く', items:[
  { t:'上下左右のまんなか', tag:'flex',
    why:'いちばん使う。親に3行書くだけ。',
    demo:`<div style="display:flex; align-items:center; justify-content:center; height:70px; width:100%; background:#f3efe6"><div class="box">まんなか</div></div>`,
    css:`.oya {
  display: flex;
  align-items: center;      /* 上下 */
  justify-content: center;  /* 左右 */
}` },

  { t:'横だけまんなか（かたまりごと）', tag:'margin',
    why:'幅を決めた箱を、ページのまんなかに置きたいとき。',
    demo:`<div style="width:100%"><div class="box" style="width:140px; margin:0 auto; text-align:center">まんなか</div></div>`,
    css:`.hako {
  width: 600px;
  /* 左右を「自動」にすると、勝手にまんなかへ来る */
  margin: 0 auto;
}` },

  { t:'ページ全体を包む幅', tag:'型',
    why:'どのサイトにもある「中身の幅を決めて中央に置く」型。',
    demo:`<div style="width:100%"><div class="box c" style="max-width:170px; margin:0 auto; padding:9px 14px; text-align:center">中身</div></div>`,
    css:`.wrap {
  width: 100%;
  max-width: 960px;   /* これ以上は広がらない */
  margin: 0 auto;
  padding: 0 16px;    /* 端に付かないように */
}` },
]},

{ g:'はみ出す・あふれる', items:[
  { t:'長い文字を「…」で切る', tag:'1行',
    why:'タイトルが長いとき、1行に収めて省略したい。',
    demo:`<div class="box" style="width:180px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">とても長いタイトルがここに入っていて収まらない</div>`,
    css:`.title {
  white-space: nowrap;      /* 折り返さない */
  overflow: hidden;         /* はみ出しを隠す */
  text-overflow: ellipsis;  /* かわりに … を出す */
}` },

  { t:'3行で「…」', tag:'複数行',
    why:'説明文を決まった行数までにしたいとき。',
    demo:`<div class="box" style="width:200px; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden">ここに長い説明が入る。2行を超えたぶんは隠れて、うしろに三点リーダが付く。</div>`,
    css:`.setsumei {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;   /* ここが行数 */
  overflow: hidden;
}` },

  { t:'長いURLを折り返す', tag:'崩れ防止',
    why:'URLや英単語がはみ出してレイアウトが崩れるとき。',
    demo:`<div class="box" style="width:180px; overflow-wrap:anywhere">https://example.com/very/long/path/name</div>`,
    css:`.honbun {
  overflow-wrap: anywhere;   /* どこでも折り返す */
}` },

  { t:'画像を枠に合わせる', tag:'画像',
    why:'大きさの違う写真を、同じ大きさのタイルに並べたいとき。',
    demo:`<div style="display:flex; gap:7px"><div style="width:62px;height:62px;background:linear-gradient(135deg,#7fb0d6,#2a6ca8);border-radius:5px"></div><div style="width:62px;height:62px;background:linear-gradient(135deg,#e8a08f,#cf4436);border-radius:5px"></div><div style="width:62px;height:62px;background:linear-gradient(135deg,#a9d39c,#4f8a5b);border-radius:5px"></div></div>`,
    css:`.shashin {
  width: 100%;
  aspect-ratio: 1 / 1;   /* 正方形にする */
  object-fit: cover;     /* はみ出す分は切る */
}` },
]},

{ g:'並べる', items:[
  { t:'横に均等に並べる', tag:'flex',
    why:'ボタンやカードを横一列に。すき間は gap で空ける。',
    demo:`<div style="display:flex; gap:8px; width:100%"><div class="box" style="flex:1; text-align:center">1</div><div class="box b" style="flex:1; text-align:center">2</div><div class="box c" style="flex:1; text-align:center">3</div></div>`,
    css:`.retsu {
  display: flex;
  gap: 12px;     /* すき間。margin より楽 */
}
.retsu > * { flex: 1; }   /* 幅を等分する */` },

  { t:'画面の幅に合わせて自動で折り返す', tag:'grid',
    why:'スマホでは1列、パソコンでは3列。数を自分で書かなくていい。',
    demo:`<div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(75px,1fr)); gap:7px; width:100%"><div class="box" style="text-align:center">A</div><div class="box b" style="text-align:center">B</div><div class="box c" style="text-align:center">C</div><div class="box" style="text-align:center">D</div></div>`,
    css:`.tairu {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
}
/* 240px 以上を保てるだけ並べて、入らなくなったら折り返す */` },

  { t:'左に文、右にボタン', tag:'flex',
    why:'ヘッダーでいちばんよく使う形。',
    demo:`<div style="display:flex; justify-content:space-between; align-items:center; width:100%"><b style="font-size:14px">タイトル</b><div class="box b" style="font-size:12px">ボタン</div></div>`,
    css:`.bar {
  display: flex;
  justify-content: space-between;  /* 両端に寄せる */
  align-items: center;
}` },

  { t:'フッターを下に貼りつける', tag:'型',
    why:'中身が少ないページで、フッターが真ん中に浮くのを防ぐ。',
    demo:`<div style="display:flex;flex-direction:column;height:74px;width:100%"><div class="box" style="font-size:12px">中身</div><div class="box c" style="margin-top:auto; font-size:12px">フッター</div></div>`,
    css:`body {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
/* 上のすき間を全部もらう＝下へ行く */
footer { margin-top: auto; }` },
]},

{ g:'見た目を整える', items:[
  { t:'やわらかい影', tag:'影',
    why:'カードを浮かせる。濃い影1つより、薄い影2つのほうがきれい。',
    demo:`<div class="box" style="box-shadow:0 1px 2px rgba(0,0,0,.08), 0 8px 20px rgba(0,0,0,.12); border:0; background:#fff">カード</div>`,
    css:`.card {
  box-shadow:
    0 1px 2px rgba(0, 0, 0, .08),
    0 8px 24px rgba(0, 0, 0, .12);
}` },

  { t:'角を丸める', tag:'形',
    why:'4px でかっちり、12px でやわらかく、9999px で丸。',
    demo:`<div style="display:flex; gap:7px; align-items:center"><div class="box" style="border-radius:4px; font-size:12px">4px</div><div class="box b" style="border-radius:12px; font-size:12px">12px</div><div class="box c" style="border-radius:9999px; font-size:12px">丸</div></div>`,
    css:`.kado  { border-radius: 12px; }
.maru  { border-radius: 9999px; }   /* 大きすぎてもよい */` },

  { t:'グラデーション', tag:'背景',
    why:'見出しの帯や、ボタンの背景に。角度は deg で。',
    demo:`<div class="box" style="border:0; color:#fff; background:linear-gradient(135deg,#cf4436,#2a6ca8)">グラデ</div>`,
    css:`.obi {
  background: linear-gradient(135deg, #cf4436, #2a6ca8);
}
/* 上から下なら to bottom、円形なら radial-gradient */` },

  { t:'すりガラス', tag:'背景',
    why:'写真の上に文字を置くとき。うしろがぼける。',
    demo:`<div style="background:linear-gradient(135deg,#cf4436,#2a6ca8); padding:12px; border-radius:6px"><div style="background:rgba(255,255,255,.35); backdrop-filter:blur(6px); padding:7px 12px; border-radius:5px; font-size:13px">すりガラス</div></div>`,
    css:`.glass {
  background: rgba(255, 255, 255, .35);
  backdrop-filter: blur(8px);
}` },

  { t:'線だけの区切り', tag:'線',
    why:'項目のあいだ。最後の1つだけ線を消すのがコツ。',
    demo:`<div style="width:100%; font-size:13px"><div style="border-bottom:1px solid rgba(44,58,66,.2); padding:4px 0">1つめ</div><div style="border-bottom:1px solid rgba(44,58,66,.2); padding:4px 0">2つめ</div><div style="padding:4px 0">3つめ</div></div>`,
    css:`.item { border-bottom: 1px solid rgba(0, 0, 0, .12); }
.item:last-child { border-bottom: none; }` },
]},

{ g:'動き', items:[
  { t:'ふわっと変える', tag:'transition',
    why:'色や大きさの変化をなめらかに。これが有ると急に本物っぽくなる。',
    demo:`<div class="box" style="transition:all .25s; cursor:pointer" onmouseover="this.style.background='#cf4436';this.style.color='#fff'" onmouseout="this.style.background='';this.style.color=''">のせてみて</div>`,
    css:`.btn {
  transition: all .25s;   /* 0.25秒かけて変わる */
}
.btn:hover {
  background: #cf4436;
  color: #fff;
}` },

  { t:'少し浮かせる', tag:'hover',
    why:'カードにマウスを乗せたとき。押せる感じが出る。',
    demo:`<div class="box" style="transition:transform .2s, box-shadow .2s; cursor:pointer" onmouseover="this.style.transform='translateY(-4px)';this.style.boxShadow='0 10px 20px rgba(0,0,0,.2)'" onmouseout="this.style.transform='';this.style.boxShadow=''">のせてみて</div>`,
    css:`.card {
  transition: transform .2s, box-shadow .2s;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 22px rgba(0, 0, 0, .2);
}` },

  { t:'なめらかにスクロール', tag:'1行',
    why:'ページ内リンクで、ぴょんと飛ばずにスーッと動く。',
    demo:`<div style="font-size:13px; color:var(--ink-2)">このページの上の目次も、これが効いている</div>`,
    css:`html {
  scroll-behavior: smooth;
  scroll-padding-top: 70px;   /* 固定ヘッダーの分 */
}` },

  { t:'くるくる回す', tag:'animation',
    why:'読み込み中のしるし。',
    demo:`<div style="width:26px;height:26px;border:3px solid rgba(44,58,66,.2);border-top-color:#cf4436;border-radius:50%;animation:spin 1s linear infinite"></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style>`,
    css:`.spinner {
  width: 26px; height: 26px;
  border: 3px solid rgba(0, 0, 0, .2);
  border-top-color: #cf4436;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}` },
]},

{ g:'スマホ対応', items:[
  { t:'画面が狭いときだけ変える', tag:'型',
    why:'まずスマホの見た目を書いて、広いときだけ上書きするのが楽。',
    demo:`<div style="font-size:13px; color:var(--ink-2); text-align:center">このページも窓を狭めると列が減る</div>`,
    css:`.retsu {
  display: grid;
  grid-template-columns: 1fr;   /* ふだんは1列 */
}
@media (min-width: 768px) {
  /* 広いときだけ2列にする */
  .retsu { grid-template-columns: 1fr 1fr; }
}` },

  { t:'文字を画面幅で伸び縮みさせる', tag:'clamp',
    why:'スマホで小さく、パソコンで大きく。@media を書かずに済む。',
    demo:`<div class="box" style="font-size:clamp(14px, 4vw, 30px)">伸び縮みする</div>`,
    css:`h1 {
  font-size: clamp(24px, 5vw, 48px);
}
/* 最小24px / ふだん画面幅の5% / 最大48px */` },

  { t:'スマホの本当の画面の高さ', tag:'1行',
    why:'100vh だとアドレスバーのぶんはみ出す。dvh を使う。',
    demo:`<div style="font-size:13px; color:var(--ink-2)">100vh → 100dvh に替えるだけ</div>`,
    css:`.zenmen {
  /* d = dynamic。バーの分を除いた高さ */
  min-height: 100dvh;
}` },

  { t:'横スクロールを止める', tag:'崩れ防止',
    why:'スマホで横に揺れるとき、たいていこれで直る。',
    demo:`<div style="font-size:13px; color:var(--ink-2)">原因は、幅を超えた要素か 100vw</div>`,
    css:`html, body {
  overflow-x: hidden;
}
/* padding を幅に含める */
* { box-sizing: border-box; }` },
]},

{ g:'書きやすくする', items:[
  { t:'色に名前を付ける', tag:'変数',
    why:'色を1か所で決めておくと、あとで全部まとめて変えられる。',
    demo:`<div style="font-size:13px; color:var(--ink-2)">このページも全部この方式</div>`,
    css:`:root {
  --main: #cf4436;
  --ink:  #2c3a42;
}
.btn   { background: var(--main); }
.title { color: var(--ink); }` },

  { t:'いちばん最初に書くやつ', tag:'型',
    why:'ブラウザごとの初期値の違いを消す。これを書かないと余白がずれる。',
    demo:`<div style="font-size:13px; color:var(--ink-2)">どのサイトでも先頭にある3行</div>`,
    css:`* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
img { display: block; max-width: 100%; }` },

  { t:'暗い画面に合わせる', tag:'ダークモード',
    why:'相手の端末が夜モードのとき、自動で色を変える。',
    demo:`<div style="font-size:13px; color:var(--ink-2)">端末の設定で自動で切り替わる</div>`,
    css:`:root { --bg: #fff; --ink: #222; }

@media (prefers-color-scheme: dark) {
  :root { --bg: #1b2126; --ink: #e6e6e0; }
}
body { background: var(--bg); color: var(--ink); }` },

  { t:'上に貼りついたまま', tag:'sticky',
    why:'ヘッダーや表の見出しを、スクロールしても見えたままにする。',
    demo:`<div style="width:100%; height:66px; overflow:auto; background:#f3efe6; border-radius:5px"><div style="position:sticky; top:0; background:#cf4436; color:#fff; font-size:12px; padding:3px 8px">貼りつく見出し</div><div style="font-size:12px; padding:5px 8px">中身<br>中身<br>中身<br>中身</div></div>`,
    css:`.header {
  position: sticky;
  top: 0;
  z-index: 10;
}` },
]},

];

/* ============================================================
   描く
   ============================================================ */
/** CSS に色を付ける。プロパティ・値・コメント・セレクタだけ */
function paint(css) {
  return esc(css)
    .replace(/(\/\*.*?\*\/)/g, '<s>$1</s>')
    .replace(/^([.#:@*][^\s{]*[^{\n]*)\{/gm, '<u>$1</u>{')
    .replace(/^(\s*)([a-z-]+)(\s*):/gm, '$1<b>$2</b>$3:');
}

function draw() {
  const out = $('#out');
  const toc = $('#toc');
  out.innerHTML = '';
  toc.innerHTML = '';

  GROUPS.forEach((grp, gi) => {
    const id = 'g' + gi;
    toc.insertAdjacentHTML('beforeend', `<a href="#${id}">${esc(grp.g)}</a>`);

    const h = document.createElement('h2');
    h.id = id;
    h.textContent = grp.g;
    out.appendChild(h);

    const cards = document.createElement('div');
    cards.className = 'cards';
    for (const it of grp.items) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.q = (it.t + ' ' + it.why + ' ' + it.tag + ' ' + it.css + ' ' + grp.g).toLowerCase();
      card.innerHTML =
        `<h3>${esc(it.t)}<span class="tag">${esc(it.tag)}</span></h3>` +
        `<p class="why">${esc(it.why)}</p>` +
        `<div class="demo">${it.demo}</div>` +
        `<div class="snip">${paint(it.css)}</div>` +
        `<button type="button" class="copy">コピー</button>`;
      card.querySelector('.copy').addEventListener('click', async ev => {
        const b = ev.currentTarget;
        try { await navigator.clipboard.writeText(it.css); } catch { return; }
        b.classList.add('done'); b.textContent = 'コピーした';
        setTimeout(() => { b.classList.remove('done'); b.textContent = 'コピー'; }, 1300);
      });
      cards.appendChild(card);
    }
    out.appendChild(cards);
  });
  filter();
}

function filter() {
  const q = $('#find').value.trim().toLowerCase();
  let n = 0, all = 0;
  for (const card of $$('.card')) {
    all++;
    const ok = !q || card.dataset.q.includes(q);
    card.style.display = ok ? '' : 'none';
    if (ok) n++;
  }
  /* 中身が全部消えた見出しは、まとめて隠す */
  for (const h of $$('#out h2')) {
    const cards = h.nextElementSibling;
    const any = [...cards.children].some(c => c.style.display !== 'none');
    h.style.display = any ? '' : 'none';
    cards.style.display = any ? '' : 'none';
  }
  $('#hit').textContent = `${n} / ${all} 件`;
}

$('#find').addEventListener('input', filter);
draw();
</script>
</body>
</html>
