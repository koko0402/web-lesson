<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ページの名前をここに</title>

    <!-- CSSの読み込み。この1行を忘れると見た目が変わりません -->
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <header class="head">
      <h1>サイトの名前</h1>
      <p class="sub">ひとことの説明</p>
    </header>

    <main class="wrap">

      <section class="box">
        <h2>見出し</h2>
        <p>本文をここに書きます。</p>
      </section>

      <section class="box">
        <h2>もうひとつ</h2>
        <p>section を増やせば、そのぶん段が増えます。</p>
      </section>

    </main>

    <footer class="foot">
      <p>&copy; 2026 じぶんの名前</p>
    </footer>

  </body>
</html>
